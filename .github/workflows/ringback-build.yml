name: ringback-build
on: { push: { branches: [ci-ringback] }, workflow_dispatch: {} }
jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Render the ringback the app would play
        run: |
          awk '/^class RingbackPlayer/,0' Snikket/voip/CallManager.swift > rb.swift
          cat >> rb.swift <<'SWIFT'
          extension RingbackPlayer { static func dump() { try! makeWav().write(to: URL(fileURLWithPath: "ringback.wav")) } }
          RingbackPlayer.dump()
          SWIFT
          sed -i '' '1s/^/import AVFoundation\n/' rb.swift
          swift rb.swift
          afinfo ringback.wav
      - uses: actions/upload-artifact@v4
        with: { name: ringback-wav, path: ringback.wav }
      # Package.resolved pins hsluv-swift 2.1.0 at 9dee437, which upstream's history rewrite left unreachable,
      # so a fresh clone fails. GitHub still serves it by hash; serve it locally under the 2.1.0 tag.
      - name: Fetch dependencies
        run: |
          git init -q --bare "$RUNNER_TEMP/hsluv.git"
          git -C "$RUNNER_TEMP/hsluv.git" fetch -q https://github.com/hsluv/hsluv-swift.git 9dee4378180f2a9a33c96bc20284cf64158dbe1b:refs/tags/2.1.0
          git config --global url."file://$RUNNER_TEMP/hsluv.git".insteadOf https://github.com/hsluv/hsluv-swift.git
          mkdir -p Frameworks  # gitignored, so absent in a fresh clone; update-frameworks.sh cds into it
          /bin/bash ./update-frameworks.sh
          xcodebuild -resolvePackageDependencies -scmProvider system -project Snikket.xcodeproj -scheme Snikket \
            -derivedDataPath build/DerivedData -clonedSourcePackagesDirPath build/DerivedData/SourcePackages \
            -onlyUsePackageVersionsFromResolvedFile
          ./Dependencies/apply-tigase-tls13-patch.sh build/DerivedData
      - name: Build for the iOS simulator (unsigned)
        run: |
          set -o pipefail
          xcodebuild -project Snikket.xcodeproj -scheme Snikket -configuration Debug \
            -derivedDataPath build/DerivedData -clonedSourcePackagesDirPath build/DerivedData/SourcePackages \
            -onlyUsePackageVersionsFromResolvedFile -scmProvider system -destination 'generic/platform=iOS Simulator' \
            IPHONEOS_DEPLOYMENT_TARGET=13.0 CODE_SIGNING_ALLOWED=NO build | tail -40
